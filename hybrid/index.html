<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Staff Hybrid Schedule | Chckpoint</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="stylesheet" href="style.css">
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../common.js?v=3.0.3"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body id="main-body">

<div class="container">
    <header>
        <div class="brand">
            <div style="display:flex; align-items:center; gap:8px;">
                <a href="../" style="color:var(--text-muted); text-decoration:none; display:inline-flex; align-items:center;" title="Back to attendance" aria-label="Back to attendance"><i data-lucide="arrow-left" size="16"></i></a>
                <h1 id="page-brand-title">Staff Hybrid Schedule</h1>
            </div>
            <small id="display-date-range"></small>
            <div id="sync-status"></div>
        </div>
        
        <div class="header-right">
            <select id="dept-filter-select" class="dept-filter-select" onchange="filterByDepartment(this.value)" aria-label="Filter by department">
                <option value="all">All Departments</option>
            </select>
            <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Switch theme" title="Toggle Theme">
                <i data-lucide="moon" size="14"></i>
            </button>
            <div id="admin-controls">
                <button class="btn-gen" onclick="generateNew()"><i data-lucide="refresh-cw" size="14"></i> Regenerate</button>
                <button class="btn-dl" onclick="downloadImage()"><i data-lucide="download" size="14"></i> JPG</button>
                <button class="btn-wa" onclick="shareWhatsApp()"><i data-lucide="image" size="14"></i> WhatsApp</button>
                <button class="btn-mail" onclick="shareGmail()"><i data-lucide="mail" size="14"></i> Gmail</button>
            </div>
        </div>
    </header>

    <div class="table-container">
        <div id="capture-zone" class="table-area">
            <table>
                <thead>
                    <tr id="table-head-days">
                        <th>Staff Name</th>
                        <!-- Days injected by JS -->
                        <th class="counter-header" data-html2canvas-ignore>Home Days</th>
                    </tr>
                </thead>
                <tbody id="schedule-body">
                    <!-- Rows injected by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <section class="history-section">
        <h3>Schedule History</h3>
        <div id="history-container" class="history-grid">
            <p class="loading-text">Synchronizing with cloud...</p>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
